syntax = "proto3";

package usercenter;

option go_package = "./usercenter";

/** ====================================================================================
 * 🏁 Model & Auth
 * =====================================================================================
 */

// User 用户模型
message User {
  int64 id = 1;
  string mobile = 2;
  string nickname = 3;
  int64 sex = 4;
  string avatar = 5;
  string info = 6;
}

// UserAuth 用户认证所需信息
message UserAuth {
  int64 id = 1;
  int64 user_id = 2;
  // 可以是手机, 邮箱, 用户名
  string auth_type = 3;
  string auth_key = 4;
}

/** ====================================================================================
 * 🏁 Request & Resp
 * =====================================================================================
 */

// RegisterRequest 注册请求
message RegisterRequest {
  string mobile = 1;
  string nickname = 2;
  string password = 3;
  string auth_type = 4;
  string auth_key = 5;
}

// RegisterResponse 注册答复
message RegisterResponse {
  string access_token = 1;
  int64 access_expire = 2;
  int64 refresh_after = 3;
}

// LoginRequest 登录请求
message LoginRequest {
  string auth_type = 1;
  string auth_key = 2;
  string password = 3;
}

// LoginResponse 登录答复
message LoginResponse {
  string access_token = 1;
  int64 access_expire = 2;
  int64 refresh_after = 3;
}

// GetUserInfoRequest 获取用户请求
message GetUserInfoRequest {
  int64 id = 1;
}
// GetUserInfoResponse 获取用户答复
message GetUserInfoResponse {
  User user = 1;
}
// GetUserAuthByAuthKeyRequest 基于 AuthKey 获取用户认证信息请求
message GetUserAuthByAuthKeyRequest {
  string auth_type = 1;
  string auth_key = 2;
}

// GetUserAuthByAuthKeyResponse 基于 AuthKey 获取用户认证信息答复
message GetUserAuthByAuthKeyResponse {
  UserAuth user_auth = 1;
}

// GetUserAuthByUserIdRequest 基于 UserId 获取用户认证信息请求
message GetUserAuthByUserIdRequest {
  int64 user_id = 1;
  string auth_type = 2;
}

// GetUserAuthByUserIdResponse 基于 UserId 获取用户认证信息答复
message GetUserAuthByUserIdResponse {
  UserAuth user_auth = 1;
}

// GenerateTokenRequest 生成 Token 请求
message GenerateTokenRequest {
  int64 user_id = 1;
}

// GenerateTokenResponse 生成 Token 答复
message GenerateTokenResponse {
  string access_token = 1;
  int64 access_expire = 2;
  int64 refresh_after = 3;
}

service UserCenterService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
  rpc GetUserAuthByAuthKey(GetUserAuthByAuthKeyRequest) returns (GetUserAuthByAuthKeyResponse);
  rpc GetUserAuthByUserId(GetUserAuthByUserIdRequest) returns (GetUserAuthByUserIdResponse);
  rpc GenerateToken(GenerateTokenRequest) returns (GenerateTokenResponse);
}
